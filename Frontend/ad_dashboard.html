<style>

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        overflow-x: hidden;
        background: #020617;
    }

    /* =========================================
       BLUE WORLD BACKGROUND
    ========================================== */

    .blue-world {
        background:
            radial-gradient(
                circle at 10% 10%,
                rgba(37, 99, 235, 0.25),
                transparent 30%
            ),

            radial-gradient(
                circle at 90% 20%,
                rgba(6, 182, 212, 0.18),
                transparent 30%
            ),

            #020617;
    }

    /* =========================================
       GLASS EFFECT
    ========================================== */

    .glass {
        background:
            rgba(2, 6, 23, 0.68);

        border:
            1px solid rgba(255, 255, 255, 0.12);

        backdrop-filter:
            blur(22px);

        -webkit-backdrop-filter:
            blur(22px);

        box-shadow:
            0 30px 100px rgba(0, 0, 0, 0.45),

            0 0 60px
            rgba(37, 99, 235, 0.12);
    }

    /* =========================================
       GRADIENT TEXT
    ========================================== */

    .blue-text {
        background:
            linear-gradient(
                90deg,
                #60a5fa,
                #22d3ee,
                #818cf8
            );

        -webkit-background-clip:
            text;

        background-clip:
            text;

        color:
            transparent;
    }

    /* =========================================
       SIDEBAR MENU HOVER
    ========================================== */

    .sidebar-item {
        transition: all 0.3s ease;
    }

    .sidebar-item:hover {
        background: rgba(37, 99, 235, 0.15);
        border-color: rgba(59, 130, 246, 0.25);
        color: #60a5fa;
        transform: translateX(3px);
    }

    /* =========================================
       LOGOUT HOVER
    ========================================== */

    .logout-button {
        transition: all 0.3s ease;
    }

    .logout-button:hover {
        background: rgba(239, 68, 68, 0.10);
        border-color: rgba(239, 68, 68, 0.25);
        color: #fca5a5;
    }

</style>

<!-- =========================================
     LOGOUT JAVASCRIPT
========================================== -->

<script>

    function logout() {

        // Remove stored admin information

        localStorage.removeItem("admin_id");

        localStorage.removeItem("admin_email");


        // Redirect to main BLENCEKART page

        window.location.href = "/index.html";

    }


    // =========================================
    // DISPLAY ADMIN EMAIL / NAME
    // =========================================

    const adminEmail =
        localStorage.getItem("admin_email");


    if (adminEmail) {

        // Display admin email on the left

        document.getElementById("adminName").textContent =
            adminEmail;

        // Display admin email on the top-right profile

        document.getElementById("adminEmailTop").textContent =
            adminEmail;

    }

</script>
