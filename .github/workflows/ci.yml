name: Customer Support AI Agent CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ollama python-dotenv

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-qwen2.5-3b

      - name: Start Ollama and pull model
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:11434 && break
            sleep 2
          done
          ollama pull qwen2.5:3b
          ollama list

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          set +e
          python -m pytest -v --tb=short -rfE 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          {
            echo '### pytest output (last 80 lines)'
            echo '```'
            tail -n 80 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-log
          path: pytest-output.txt

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create build package
        run: |
          mkdir -p build
          cp backend/*.py build/
          cp requirements.txt build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: customer-support-build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: customer-support-build
          path: deployment/

      - name: Show deployment files
        run: |
          echo "Files to deploy:"
          ls -R deployment/

      - name: Deploy application
        run: |
          echo "Deploying Customer Support AI Agent..."
          # Replace with your actual deployment command, e.g.:
          # docker build -t myrepo/customer-support-agent .
          # docker push myrepo/customer-support-agent
          echo "Deployment successful!"