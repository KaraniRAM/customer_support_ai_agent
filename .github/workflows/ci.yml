name: Customer Support AI Agent CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create build package
        run: |
          mkdir -p build
          cp backend/*.py build/
          cp requirements.txt build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: customer-support-build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: customer-support-build
          path: deployment/

      - name: Show deployment files
        run: |
          echo "Files to deploy:"
          ls -R deployment/

      - name: Deploy application
        run: |
          echo "Deploying Customer Support AI Agent..."
          # Replace with your actual deployment command, e.g.:
          # docker build -t myrepo/customer-support-agent .
          # docker push myrepo/customer-support-agent
          echo "Deployment successful!"