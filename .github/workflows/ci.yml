name: Customer Support AI Agent CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest   # ensure pytest is available

      - name: Run tests
        run: pytest -v   # let pytest discover all tests


  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build package
        run: |
          mkdir build
          cp backend/*.py build/
          cp requirements.txt build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-support-build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: customer-support-build
          path: deployment/

      - name: Show deployment files
        run: |
          echo "Files to deploy:"
          ls -R deployment/

      - name: Deploy application
        run: |
          echo "Deploying Customer Support AI Agent..."
          # Replace this with your actual deployment command
          # Example:
          # docker build -t myrepo/customer-support-agent .
          # docker push myrepo/customer-support-agent
          echo "Deployment successful!"
